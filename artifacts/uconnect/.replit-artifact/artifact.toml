kind = "mobile"
previewPath = "/"
title = "UConnect"
version = "1.0.0"
id = "artifacts/uconnect"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 20772

[services.development]
run = "pnpm --filter @workspace/uconnect run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/uconnect", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/uconnect", "run", "serve" ]

[services.env]
PORT = "20772"
BASE_PATH = "/"
